name: cineva
description: "Cineva - TMDB tabarli film ve dizi kesif uygulmasi. Trendler, keşif filtreleri, listeler, incelemeler ve daha fazlası."
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  cached_network_image: ^3.4.1
  google_mobile_ads: ^5.2.0
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  url_launcher: ^6.3.1
  shimmer: ^3.0.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  image: 4.12.0
  flutter_launcher_icons: 0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0B0F14"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
